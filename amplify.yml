# AWS Amplify Hosting build spec — monorepo, Next.js app in web/.
#
# Platform: WEB_COMPUTE (SSR) is set in infrastructure/stacks/amplify_stack.py.
# NEXT_PUBLIC_API_URL is injected automatically by the AmplifyStack CDK construct.
# When deploying manually via the Amplify Console, set it to your API Gateway URL:
#   https://<id>.execute-api.<region>.amazonaws.com
#
# This file must be at the repo root.  Amplify finds it automatically.

version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            # Install exact locked versions; faster and more reproducible than npm install.
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # Amplify Hosting reads the .next output directory for SSR deployment.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Frame-Options'
            value: 'SAMEORIGIN'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
      # Cache static assets aggressively (Next.js content-hashed filenames)
      - pattern: '_next/static/**/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
