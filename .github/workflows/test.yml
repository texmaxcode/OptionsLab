name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "staging", "develop"]

jobs:
  # ------------------------------------------------------------------ #
  # Python — pytest
  # ------------------------------------------------------------------ #
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: PYTHONPATH=. python -m pytest tests/ -v --tb=short

  # ------------------------------------------------------------------ #
  # Frontend — ESLint + Next.js build check
  # ------------------------------------------------------------------ #
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          # Provide a placeholder so Next.js doesn't fail on missing env var
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ------------------------------------------------------------------ #
  # CDK synth — validate infrastructure templates compile
  # ------------------------------------------------------------------ #
  infrastructure:
    name: CDK synth
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK Python dependencies
        run: pip install -r infrastructure/requirements.txt

      - name: Synth dev
        run: cdk synth --context stage=dev --no-staging
        working-directory: infrastructure

      - name: Synth staging
        run: cdk synth --context stage=staging --no-staging
        working-directory: infrastructure

      - name: Synth production
        run: cdk synth --context stage=production --no-staging
        working-directory: infrastructure
